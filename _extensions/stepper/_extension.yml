title: Stepper
author: Nathan Hüsken
version: "0.1.0"
quarto-required: ">=1.4.0"

# Two constructs: `.stepper` (usually generated by `explain`) and
# `.r-stack-fragments`, the fragment stack it is built from, offered on its own.

# `at: pre-ast` is mandatory: the filter has to see the code block as
# it stands in the source. Later — after Quarto's own filters — a block with
# `filename=` is already wrapped in a `.code-with-filename` div.

contributes:
  filters:
    - path: stepper.lua
      at: pre-ast
